name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flight_ops
          POSTGRES_USER: flight_ops
          POSTGRES_PASSWORD: flight_ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flight_ops -d flight_ops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      POSTGRES_DB: flight_ops
      POSTGRES_USER: flight_ops
      POSTGRES_PASSWORD: flight_ops
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: python manage.py spectacular --validate --fail-on-warn --file /tmp/openapi.yaml
      - run: docker build --tag flight-ops-api:ci .
